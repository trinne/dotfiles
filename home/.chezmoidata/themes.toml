# Color themes. The active one is chosen with `theme set <name>` (data: theme) and every
# themed tool is generated from its palette: Alacritty, Windows Terminal, tmux, fzf,
# starship, k9s, bat/delta. Keep the names in sync with the choice list in .chezmoi.toml.tmpl.
#
# Palette keys:
#   bg / bg_alt / bg_sel   background, darker panels (status bars), selection
#   fg / fg_dim            text, comments and inactive elements
#   accent / accent_alt    primary and secondary highlight
#   normal.* / bright.*    the 16 terminal ANSI colors
#   bat                    bat/delta syntax theme (file in ~/.config/bat/themes or built in)

[themes.tokyonight-storm]
title = "Tokyo Night Storm"
bat = "tokyonight_storm"
[themes.tokyonight-storm.colors]
bg = "#24283b"
bg_alt = "#1f2335"
bg_sel = "#364a82"
fg = "#c0caf5"
fg_dim = "#565f89"
accent = "#7aa2f7"
accent_alt = "#bb9af7"
[themes.tokyonight-storm.colors.normal]
black = "#1d202f"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
[themes.tokyonight-storm.colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

