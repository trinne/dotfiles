[general]
import = ["~/.config/alacritty/themes/themes/tokyo_night_storm.toml"]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
decorations = "Buttonless"
dynamic_padding = false
opacity = 0.95
option_as_alt = "Both"

[window.padding]
x = 5
y = 5

[font]
size = 16.0
normal = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
