# Base tools: installed on every host and in the devbox image.
# Languages and dev tools are NOT here: projects declare them in their own mise.toml
# (see `toolset add ...`), hosts can opt in via ~/.config/mise/conf.d/toolsets.toml.

[tools]
chezmoi = "latest"
neovim = "latest"
tree-sitter = "latest"   # nvim-treesitter builds parsers with it
starship = "latest"
fzf = "latest"
zoxide = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
eza = { version = "latest", os = ["linux"] }   # no macOS binaries upstream -> Homebrew on mac
jq = "latest"
yq = "latest"
gh = "latest"
lazygit = "latest"
delta = "latest"

[settings]
experimental = true
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["node", "python", "java"]
