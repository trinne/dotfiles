{{- /* Shared Alacritty config. Data: the chezmoi data map plus windows=true for the Windows copy. */ -}}
{{- $t := index .themes .theme -}}
{{- $c := $t.colors -}}
# Generated by chezmoi (theme: {{ $t.title }}). Change the theme with `theme set <name>`.
[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
dynamic_padding = false
opacity = 0.95
{{- if .isMac }}
decorations = "Buttonless"
option_as_alt = "Both"
{{- end }}

[window.padding]
x = 5
y = 5

[font]
size = {{ if .isMac }}16.0{{ else }}12.0{{ end }}
normal = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
{{- if .windows }}

# Alacritty on Windows opens straight into this WSL distribution
[terminal.shell]
program = "wsl.exe"
args = ["--distribution", "{{ .wslDistro }}", "--cd", "~"]
{{- end }}

[colors.primary]
background = "{{ $c.bg }}"
foreground = "{{ $c.fg }}"

[colors.cursor]
text = "{{ $c.bg }}"
cursor = "{{ $c.fg }}"

[colors.selection]
text = "CellForeground"
background = "{{ $c.bg_sel }}"
{{ range $kind := list "normal" "bright" }}
[colors.{{ $kind }}]
{{- $p := index $c $kind }}
{{- range $name := list "black" "red" "green" "yellow" "blue" "magenta" "cyan" "white" }}
{{ $name }} = "{{ index $p $name }}"
{{- end }}
{{ end -}}
