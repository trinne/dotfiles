name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git curl ca-certificates sudo
      - uses: actions/checkout@v5
      - name: Bootstrap from this checkout
        run: DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh ./install.sh
      - name: Idempotent (second apply changes nothing)
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          test -z "$(chezmoi diff --source "$GITHUB_WORKSPACE")"
          chezmoi verify --source "$GITHUB_WORKSPACE"
      - name: Toolchain works
        run: zsh -lic 'node --version && python --version && java --version && clojure -Sdescribe >/dev/null && lein version && nvim --version | head -1'
      - name: shellcheck scripts
        run: zsh -lc 'shellcheck install.sh home/dot_local/bin/executable_devbox'

  macos:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap from this checkout (casks + defaults skipped on CI)
        run: DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh ./install.sh
      - name: Toolchain works
        run: zsh -lic 'node --version && python --version && java --version && nvim --version | head -1'
