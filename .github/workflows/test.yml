name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly: catch upstream tool releases that break the bootstrap or image
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Bootstrap inside a container: base tools go system-wide, project toolsets work
  linux-container:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git curl ca-certificates sudo
      - uses: actions/checkout@v5
      - name: Bootstrap from this checkout
        run: DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh ./install.sh
      - name: Idempotent (second apply changes nothing)
        run: |
          export PATH="$HOME/.local/bin:/usr/local/share/mise/shims:$HOME/.local/share/mise/shims:$PATH"
          test -z "$(chezmoi diff --source "$GITHUB_WORKSPACE")"
          chezmoi verify --source "$GITHUB_WORKSPACE"
      - name: Base tools work, no languages installed
        run: |
          zsh -lic 'nvim --version | head -1 && rg --version | head -1 && starship --version'
          test -d /usr/local/share/mise/installs/neovim
          ! zsh -lc 'mise which node' 2>/dev/null
      - name: Project toolsets (toolset add node clojure)
        run: |
          mkdir -p /tmp/proj && cd /tmp/proj
          zsh -lc 'toolset add node clojure && mise install --yes'
          zsh -lc 'node --version && clojure -M -e "(println (clojure-version))" && lein version'
      - name: shellcheck scripts
        run: |
          cd /tmp/proj && zsh -lc 'toolset add shell'
          zsh -lc "cd /tmp/proj && shellcheck $GITHUB_WORKSPACE/install.sh $GITHUB_WORKSPACE/home/dot_local/bin/executable_devbox $GITHUB_WORKSPACE/home/dot_local/bin/executable_devbox-init $HOME/.local/bin/toolset"

  # Bootstrap on a plain Linux host: base tools only (toolsets are opt-in)
  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap from this checkout
        run: DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh ./install.sh
      - name: Base tools present, toolsets not installed
        run: |
          zsh -lic 'nvim --version | head -1 && rg --version | head -1 && starship --version && tmux -V'
          ! zsh -lc 'mise which node' 2>/dev/null
          ! zsh -lc 'mise which java' 2>/dev/null
          test ! -e "$HOME/.config/mise/conf.d/toolsets.toml"
          test ! -e "$HOME/.lein"

  # Host with an opted-in toolset
  linux-host-toolsets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap with DOTFILES_TOOLSETS=node,k8s
        run: DOTFILES_TOOLSETS=node,k8s DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh ./install.sh
      - name: Toolsets installed globally
        run: |
          zsh -lc 'mise which node && mise which kubectl'
          test -e "$HOME/.config/k9s/config.yaml"
          test ! -e "$HOME/.lein"

  # Linux desktop: font, Alacritty config, themes and switching (snap installs are skipped on CI)
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap as a desktop with the Nord theme
        run: DOTFILES_DESKTOP=1 DOTFILES_THEME=nord DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh ./install.sh
      - name: Font, terminal and theme are in place
        run: |
          fc-list | grep -q "MesloLGS Nerd Font Mono"
          grep -q '^background = "#2e3440"' ~/.config/alacritty/alacritty.toml
          zsh -lc 'bat --list-themes | grep -qx tokyonight_storm && bat --list-themes | grep -qx "Catppuccin Mocha"'
      - name: theme set switches every themed file
        run: |
          zsh -lc 'theme set catppuccin-mocha'
          test "$(zsh -lc theme)" = catppuccin-mocha
          grep -q '#1e1e2e' ~/.config/alacritty/alacritty.toml
          grep -q '#181825' ~/.config/tmux/tmux.conf
          grep -q 'Catppuccin Mocha' ~/.config/git/config
          test "$(cat ~/.config/dotfiles/theme)" = catppuccin-mocha   # read by the nvim config
          zsh -lc 'test -z "$(chezmoi diff)"'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap from this checkout (casks + defaults skipped on CI)
        run: DOTFILES_SOURCE="$GITHUB_WORKSPACE" sh ./install.sh
      - name: Base tools work, no languages installed
        run: |
          zsh -lic 'nvim --version | head -1 && rg --version | head -1 && starship --version'
          ! zsh -lc 'mise which node' 2>/dev/null

  # devbox: local image build (`devbox build` and auto-build) + run, with both engines
  devbox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      DEVBOX_ENGINE: ${{ matrix.engine }}
      DEVBOX_SOURCE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - name: Auto-build on first use
        run: |
          devbox=$GITHUB_WORKSPACE/home/dot_local/bin/executable_devbox
          mkdir -p /tmp/empty && cd /tmp/empty
          bash "$devbox" true 2>&1 | tee first.log
          grep -q "not found, building it" first.log
          "$DEVBOX_ENGINE" image inspect localhost/devbox:latest >/dev/null
      - name: Explicit rebuild (devbox build)
        run: bash "$GITHUB_WORKSPACE/home/dot_local/bin/executable_devbox" build
      - name: Project with a node toolset
        run: |
          devbox=$GITHUB_WORKSPACE/home/dot_local/bin/executable_devbox
          mkdir -p /tmp/proj && printf '[tools]\nnode = "lts"\n' > /tmp/proj/mise.toml && cd /tmp/proj
          # docker (no keep-id) writes as uid 1000; the runner user is 1001
          [ "$DEVBOX_ENGINE" = docker ] && chmod 0777 /tmp/proj
          bash "$devbox" node --version
          bash "$devbox" node --version 2>&1 | tee second.log
          ! grep -q "node@" second.log   # second run: nothing installed again
          bash "$devbox" touch created-in-box
          ls -ln created-in-box
          if [ "$DEVBOX_ENGINE" = podman ]; then
            test "$(stat -c %u created-in-box)" = "$(id -u)"   # keep-id preserves host ownership
          fi
